# Publishes a GitHub release when a maintainer pushes a version tag (vX.Y.Z),
# after the static checks pass on it. Release steps: CONTRIBUTING.md, Releases.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (MIT)
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 (MIT)
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2 (MPL-2.0)
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: scripts/check.sh

  release:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (MIT)
        with:
          persist-credentials: false
      # Notes: the merged pull requests since the previous tag (generated by
      # GitHub), after a pointer to the upgrade notes. A tag below v1.0.0 is
      # marked as a pre-release.
      - run: |
          prerelease=()
          [[ "$TAG" == v0.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes --title "FodyCloud $TAG" "${prerelease[@]}" \
            --notes "Upgrading a platform: see [docs/operations/upgrades.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/operations/upgrades.md#upgrade-notes)."
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
