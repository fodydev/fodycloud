# Traefik dynamic configuration (managed by Terraform)
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
