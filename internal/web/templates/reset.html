{{define "content"}}
<section class="auth">
  <div class="auth-head">
    <img src="/static/brand/emblem.svg" alt="" width="48" height="48">
    <h1>Choose a new password</h1>
  </div>
  <div class="card"><div class="card-body">
    <form method="post" action="/reset" class="stack">
      <input type="hidden" name="token" value="{{.Data.Token}}">
      <label>New password <small class="muted">At least 10 characters.</small>
        <input type="password" name="password" required minlength="10" maxlength="72" autocomplete="new-password" autofocus></label>
      <button class="btn block">Change password</button>
    </form>
  </div></div>
  <p class="muted center">You will be signed out everywhere and your API tokens will be revoked.</p>
</section>
{{end}}
