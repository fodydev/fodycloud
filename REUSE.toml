# Licensing of the files that can't carry a header (docs, templates, static
# files, data, configuration). Code files (Go, shell, SQL, OpenTofu) are
# deliberately not listed: each must carry its own SPDX header, and
# `reuse lint` (scripts/check.sh) fails on one that doesn't.
version = 1

[[annotations]]
path = [
  "**.md",
  "**.html",
  "**.css",
  "**.js",
  "**.svg",
  "**.json",
  "**.yaml",
  "**.yml",
  "**.tftpl",
  "**.tfvars",
  "**.tfvars.example",
  "**.conf",
  "**.service",
  "**.timer",
  "**/.terraform.lock.hcl",
  "**/.gitignore",
  "**/.shellcheckrc",
  "go.mod",
  "go.sum",
  "Dockerfile",
  "NOTICE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 FodyDev and the FodyCloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Contributor Covenant 2.1, with our contact address filled in.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Vendored htmx 2.0.11 (https://htmx.org), unmodified.
[[annotations]]
path = "internal/web/static/htmx.min.js"
precedence = "override"
SPDX-FileCopyrightText = "Big Sky Software"
SPDX-License-Identifier = "0BSD"
